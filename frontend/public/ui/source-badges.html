<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Source Badges</title>
  <style>
    :root {
      --bg: oklch(98% 0.005 250);
      --surface: oklch(100% 0 0);
      --fg: oklch(22% 0.02 240);
      --muted: oklch(50% 0.018 240);
      --border: oklch(90% 0.008 240);
      --accent: oklch(58% 0.16 145);
      --success: oklch(64% 0.16 145);
      --warn: oklch(74% 0.16 78);
      --font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--fg); }
    .app { min-height: 100svh; padding: 18px; display: grid; gap: 12px; }
    .panel { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .head { padding: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .title { margin: 0; font-size: 1.25rem; letter-spacing: -0.02em; }
    .meta { color: var(--muted); font-size: .9rem; }
    .toolbar { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    .card { padding: 12px; }
    .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .value { margin-top: 6px; font-size: 1.3rem; font-family: var(--font-mono); }
    .btn, input { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; background: var(--surface); color: var(--fg); }
    .btn { background: color-mix(in oklch, var(--accent) 16%, var(--surface)); color: color-mix(in oklch, var(--accent) 62%, black); font-weight: 650; cursor: pointer; }
    .btn.subtle { background: var(--surface); color: var(--fg); }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px; text-align: left; font-size: .9rem; white-space: nowrap; }
    th { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .badge { padding: 3px 7px; border-radius: 999px; font-size: .72rem; border: 1px solid var(--border); }
    .ok { color: color-mix(in oklch, var(--success) 70%, black); }
    .warn { color: color-mix(in oklch, var(--warn) 65%, black); }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    html[data-theme="dark"], body[data-theme="dark"] {
      --bg: oklch(17% 0.01 255);
      --surface: oklch(22% 0.01 255);
      --fg: oklch(95% 0.01 255);
      --muted: oklch(76% 0.01 255);
      --border: oklch(36% 0.01 255);
      --accent: oklch(70% 0.14 150);
    }
  </style>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('ffck:theme') || 'dark';
  </script>
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="head">
        <div>
          <h1 class="title">Source Badges</h1>
          <div class="meta" id="statusText">Aucune campagne sélectionnée</div>
        </div>
        <label class="btn" for="badgeFile">Importer Excel badges</label>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Rechercher nom, prénom, licence..." />
        <button class="btn subtle" id="refreshButton" type="button">Rafraîchir</button>
      </div>
    </section>

    <section class="grid" aria-label="KPI badges">
      <article class="panel card"><div class="label">Lignes importées</div><div class="value" id="kpiRows">0</div></article>
      <article class="panel card"><div class="label">Badge possédé</div><div class="value" id="kpiOwned">0</div></article>
      <article class="panel card"><div class="label">Badge commandé</div><div class="value" id="kpiOrdered">0</div></article>
    </section>

    <section class="panel table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Licence</th>
            <th>Possédé</th>
            <th>Commandé</th>
            <th>Lié membre</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </div>

  <input id="badgeFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />

  <script>
    const search = document.getElementById('search');
    const refreshButton = document.getElementById('refreshButton');
    const badgeFile = document.getElementById('badgeFile');
    const rowsEl = document.getElementById('rows');
    const statusText = document.getElementById('statusText');
    const kpiRows = document.getElementById('kpiRows');
    const kpiOwned = document.getElementById('kpiOwned');
    const kpiOrdered = document.getElementById('kpiOrdered');

    let activeCampaignId = null;
    let activeCampaignTitle = '';
    let allRows = [];

    function readCookie(name) {
      const cookieName = String(name || '').trim();
      if (!cookieName) return '';
      const parts = document.cookie ? document.cookie.split(';') : [];
      for (const part of parts) {
        const trimmed = part.trim();
        if (trimmed.startsWith(cookieName + '=')) {
          return decodeURIComponent(trimmed.slice(cookieName.length + 1));
        }
      }
      return '';
    }

    function emitUiFilters() {
      if (!(window.parent && window.parent !== window)) return;
      window.parent.postMessage(
        {
          type: 'ffck:uiFiltersChanged',
          page: 'badges',
          filters: { search: String(search?.value || '') },
        },
        window.location.origin,
      );
    }

    function applyUiFilters(filters) {
      if (!filters || typeof filters !== 'object') return;
      if (typeof filters.search === 'string') search.value = filters.search;
    }

    function badgePill(value) {
      const isTrue = Boolean(value);
      const label = isTrue ? 'Oui' : 'Non';
      return `<span class="badge ${isTrue ? 'ok' : 'warn'}">${label}</span>`;
    }

    function renderRows() {
      const q = String(search.value || '').trim().toLowerCase();
      const filtered = allRows.filter((row) => {
        if (!q) return true;
        return [row.name, row.first_name, row.licence].some((value) =>
          String(value || '').toLowerCase().includes(q),
        );
      });

      rowsEl.innerHTML = filtered
        .map((row) => `
          <tr>
            <td>${row.name || '—'}</td>
            <td>${row.first_name || '—'}</td>
            <td>${row.licence || '—'}</td>
            <td>${badgePill(row.badge_owned)}</td>
            <td>${badgePill(row.badge_ordered)}</td>
            <td>${Number.isFinite(Number(row.member_id)) ? 'Oui' : 'Non'}</td>
          </tr>
        `)
        .join('');

      kpiRows.textContent = String(filtered.length);
      kpiOwned.textContent = String(filtered.filter((row) => row.badge_owned).length);
      kpiOrdered.textContent = String(filtered.filter((row) => row.badge_ordered).length);
    }

    async function loadLatestRows() {
      if (!Number.isFinite(Number(activeCampaignId))) {
        allRows = [];
        statusText.textContent = 'Aucune campagne sélectionnée';
        renderRows();
        return;
      }

      const response = await fetch(`/api/badges/rows/latest/?campaignId=${encodeURIComponent(String(activeCampaignId))}`);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const message = payload?.error || `Erreur HTTP ${response.status}`;
        statusText.textContent = `Erreur chargement badges: ${message}`;
        return;
      }

      allRows = Array.isArray(payload?.rows) ? payload.rows : [];
      const importMeta = payload?.import || null;
      if (importMeta?.fetched_at) {
        const dateLabel = new Intl.DateTimeFormat('fr-FR', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(importMeta.fetched_at));
        statusText.textContent = `${activeCampaignTitle || 'Campagne'} • Dernier import: ${dateLabel} • ${allRows.length} ligne(s)`;
      } else {
        statusText.textContent = `${activeCampaignTitle || 'Campagne'} • Aucun import badge`;
      }
      renderRows();
    }

    async function uploadBadgeFile(file) {
      if (!Number.isFinite(Number(activeCampaignId))) {
        statusText.textContent = 'Sélectionnez une campagne avant import.';
        return;
      }
      if (!(file instanceof File)) return;

      statusText.textContent = `Import en cours (${file.name})...`;
      const formData = new FormData();
      formData.append('file', file);

      const headers = {};
      const csrfToken = readCookie('csrftoken');
      if (csrfToken) headers['X-CSRFToken'] = csrfToken;

      const response = await fetch(`/api/badges/import/?campaignId=${encodeURIComponent(String(activeCampaignId))}`, {
        method: 'POST',
        headers,
        body: formData,
      });
      const payload = await response.json().catch(() => ({}));

      if (!response.ok) {
        const message = payload?.error || `Erreur HTTP ${response.status}`;
        statusText.textContent = `Échec import badges: ${message}`;
        return;
      }

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'ffck:refreshActiveCampaignMembers' }, window.location.origin);
      }
      await loadLatestRows();
    }

    search.addEventListener('input', () => {
      emitUiFilters();
      renderRows();
    });

    refreshButton.addEventListener('click', () => {
      loadLatestRows();
    });

    badgeFile.addEventListener('change', async (event) => {
      const file = event.target.files?.[0];
      await uploadBadgeFile(file);
      event.target.value = '';
    });

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) return;
      if (event.data?.type !== 'ffck:activeCampaignContext') return;

      applyUiFilters(event.data?.uiFilters);
      const nextCampaignId = Number(event.data?.campaignId);
      activeCampaignId = Number.isFinite(nextCampaignId) ? nextCampaignId : null;
      activeCampaignTitle = typeof event.data?.campaignTitle === 'string' ? event.data.campaignTitle.trim() : '';

      loadLatestRows();
    });

    window.addEventListener('storage', (event) => {
      if (!event.key || event.key === 'ffck:theme') {
        document.documentElement.dataset.theme = localStorage.getItem('ffck:theme') || 'dark';
      }
    });

    renderRows();
  </script>
</body>
</html>
