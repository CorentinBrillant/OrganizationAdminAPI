services:
  db:
    image: postgres:16-alpine
    container_name: organization-admin-db-prod
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./dbdata/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: organization-admin-backend-prod
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DB_ENGINE: ${DB_ENGINE}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.mail.yahoo.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:?Set EMAIL_HOST_USER in .env.prod}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?Set EMAIL_HOST_PASSWORD in .env.prod}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-1}
    expose:
      - "8000"
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_AUTH_TOKEN: ${VITE_API_AUTH_TOKEN:-}
    container_name: organization-admin-frontend-builder-prod
    user: "0:0"
    volumes:
      - frontend_dist:/frontend-dist
    depends_on:
      - backend

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: organization-admin-nginx-prod
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.ckcp-admin.rule=Host(`ckcp-admin.iaforever.cloud`)
      - traefik.http.routers.ckcp-admin.entrypoints=websecure
      - traefik.http.routers.ckcp-admin.tls=true
      - traefik.http.routers.ckcp-admin.tls.certresolver=letsencrypt
      - traefik.http.services.ckcp-admin.loadbalancer.server.port=80
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - django_static:/usr/share/nginx/django-static:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-builder:
        condition: service_completed_successfully

volumes:
  frontend_dist:
  django_static:
  django_media:
