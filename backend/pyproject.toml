[project]
name = "organization-admin-backend"
version = "0.1.0"
description = "Backend API for OrganizationAdminAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==6.0.6",
    "django-cryptography-django5==2.2",
    "gunicorn==23.0.0",
    "openpyxl==3.1.5",
    "pillow==11.3.0",
    "psycopg2-binary==2.9.10",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
