services:
  db:
    image: postgres:16-alpine
    container_name: organization-admin-db
    environment:
      POSTGRES_DB: organization_admin
      POSTGRES_USER: organization_admin
      POSTGRES_PASSWORD: organization_admin
    ports:
      - "5432:5432"
    volumes:
      - ./dbdata/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organization_admin -d organization_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: organization-admin-backend
    env_file:
      - ./.env.local
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Corporate root CA is mounted only for local HTTPS interception.
      - /usr/local/share/ca-certificates/arstxd-root-ca.crt:/usr/local/share/ca-certificates/arstxd-root-ca.crt:ro
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: organization_admin
      DB_USER: organization_admin
      DB_PASSWORD: organization_admin
      DB_HOST: db
      DB_PORT: "5432"
      EMAIL_HOST: ${EMAIL_HOST:-smtp.mail.yahoo.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:?Set EMAIL_HOST_USER in .env.local}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?Set EMAIL_HOST_PASSWORD in .env.local}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: organization-admin-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_AUTH_TOKEN: ${VITE_API_AUTH_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
